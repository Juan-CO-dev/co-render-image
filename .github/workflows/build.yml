# GitHub Actions workflow for the co-render-image repo (CC moves this file to .github/workflows/build.yml there).
# Builds the Dockerfile beside it on every version tag and pushes ghcr.io/<owner>/co-blender:<tag>. The tag IS the
# image version (5.2.1-1, 5.2.1-2, ...); there is no `latest` tag, by ruling. Nothing is built on the CO desktop or
# the game PC. The build needs no secrets beyond the repo's own GITHUB_TOKEN with packages: write.
name: build-co-blender-image
on:
  push:
    tags:
      - "5.*"
  workflow_dispatch: {}
permissions:
  contents: read
  packages: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # 5.2.1-3 adds a multi-GB COLMAP prefix; the runner's default free disk is tight for build + push + smoke pulls
      - name: free runner disk
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL && df -h /
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: image name
        id: meta
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/co-blender:${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.image }}
          provenance: false
      - name: smoke the pushed image (Blender version + ffmpeg + COLMAP built with CUDA + open3d + trimesh)
        run: |
          docker run --rm ${{ steps.meta.outputs.image }} /opt/blender/blender -b --version | head -1
          docker run --rm ${{ steps.meta.outputs.image }} ffmpeg -version | head -1
          docker run --rm ${{ steps.meta.outputs.image }} sh -c 'colmap help | head -1' | tee /tmp/colmap.txt
          grep -q "with CUDA" /tmp/colmap.txt
          docker run --rm ${{ steps.meta.outputs.image }} recon-python -c "import open3d, trimesh; print('open3d', open3d.__version__, 'trimesh', trimesh.__version__)"
